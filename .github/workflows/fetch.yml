name: Fetch prices

on:
  schedule:
    # GitHub может пропускать запуски по расписанию, поэтому будим каждый час,
    # а реальный сбор делаем, только если с прошлой проверки прошло ≥ MIN_INTERVAL_MIN.
    - cron: "23 * * * *"
  workflow_dispatch:
  # новая/изменённая/удалённая вкладка (routes/*.json) — сразу собираем цены
  push:
    paths:
      - "routes/**"
      - "config.json"

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

env:
  MIN_INTERVAL_MIN: "210"   # 3,5 часа → на практике сбор примерно раз в 4 часа

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check interval
        id: gate
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          skip = False
          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              try:
                  last = json.load(open("data/last_run.json"))["checked_at"]
                  age = (datetime.now(timezone.utc) - datetime.fromisoformat(last.replace("Z", "+00:00"))).total_seconds() / 60
                  skip = age < int(os.environ["MIN_INTERVAL_MIN"])
                  print(f"С прошлой проверки {age:.0f} мин → {'пропуск' if skip else 'сбор'}")
              except Exception as e:
                  print("Нет данных о прошлой проверке:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Fetch prices
        id: fetch
        if: steps.gate.outputs.skip != 'true'
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python fetch.py
        # даже если все запросы упали, коммитим last_run.json со статусом
        continue-on-error: true

      - name: Commit data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          git commit -m "data: prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase
            sleep $((i * 5))
          done
          exit 1

      - name: Fail if fetch failed
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::fetch.py завершился с ошибкой — см. лог шага Fetch prices"
          exit 1
