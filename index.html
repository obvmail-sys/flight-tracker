<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цены на авиабилеты</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6ea;
    --out: #2563eb; --back: #d9480f; --out-dark: #1e3a8a; --back-dark: #9a3412; --trend: #1b1f24; --good: #15803d; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #171b21; --text: #e6e8eb; --muted: #98a2b3; --line: #2a3038;
            --out: #60a5fa; --back: #fb923c; --out-dark: #bfdbfe; --back-dark: #fed7aa; --trend: #e6e8eb; --good: #4ade80; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 0; }
  h3 { font-size: 15px; margin: 18px 0 8px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-top: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 8px; padding: 8px 10px; min-width: 0; }
  input.code { width: 96px; text-transform: uppercase; font-weight: 600; letter-spacing: .05em; }
  button { font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button.primary { background: var(--out); border-color: var(--out); color: #fff; font-weight: 600; }
  .status { font-size: 13px; margin-top: 10px; }
  .err { color: var(--bad); }
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .head .bar { width: 4px; align-self: stretch; border-radius: 2px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .down { color: var(--good); } .up { color: var(--bad); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; margin: 12px 0 4px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
  .dash { display: inline-block; width: 18px; border-top: 2px dashed var(--trend); vertical-align: middle; margin-right: 6px; }
  svg text { fill: var(--muted); font-size: 11px; }
  .chart { min-height: 120px; }
  html { overflow-anchor: none; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  td.num, th.num { text-align: right; }
  tr.cheap td:first-child { box-shadow: inset 3px 0 0 var(--good); }
  details.month { border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
  details.month > summary { padding: 10px 12px; cursor: pointer; list-style: none; display: flex;
                            gap: 8px; align-items: baseline; flex-wrap: wrap; }
  details.month > summary::-webkit-details-marker { display: none; }
  details.month > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.month[open] > summary::before { transform: rotate(90deg); }
  details.month > summary b { text-transform: capitalize; }
  details.month .tablewrap { padding: 0 4px 6px; }
  .daybox { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 4px; }
  .daybox .dayhead { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
  .daybox .dayhead button { padding: 2px 10px; }
  .chart svg [data-date] { cursor: pointer; }
  .hint { font-size: 12px; }
  .days { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .dayrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dlabel { width: 64px; font-size: 13px; color: var(--muted); }
  .chipset { display: flex; flex-wrap: wrap; gap: 4px; }
  .dchip { padding: 4px 0; width: 38px; font-size: 13px; border-radius: 8px; text-align: center; }
  .dchip.on { background: var(--out); border-color: var(--out); color: #fff; }
  .chipset[data-dir=back] .dchip.on { background: var(--back); border-color: var(--back); }
  #matchBtn.on { background: var(--good); border-color: var(--good); color: #fff; }
  details.wk { border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; }
  details.wk > summary { padding: 9px 12px; cursor: pointer; list-style: none; display: flex; gap: 6px 10px;
                         flex-wrap: wrap; align-items: baseline; font-variant-numeric: tabular-nums; }
  details.wk > summary::-webkit-details-marker { display: none; }
  details.wk > summary::before { content: "▸"; color: var(--muted); }
  details.wk[open] > summary::before { content: "▾"; }
  details.wk.best { border-color: var(--good); }
  .wkbody { padding: 0 12px 10px; display: grid; gap: 6px; }
  .combo { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  .combo.top { border-color: var(--good); }
  .combo .legs { color: var(--muted); }
  .combo.none { opacity: .5; }
  .curve { display: inline-block; width: 18px; border-top: 3px solid; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .dash { border-top-color: var(--trend); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin: 10px 0 4px; }
  .toggles label { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 13px; cursor: pointer; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chips .chip { flex: 1 0 76px; }
  .chip { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 8px;
          text-align: left; font-variant-numeric: tabular-nums; }
  .chip span { font-size: 12px; color: var(--muted); text-transform: capitalize; }
  .chip b { font-size: 16px; }
  .chip small { font-size: 11px; }
  .chip.best { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
  .chip:disabled { opacity: .55; cursor: default; }
  a { color: var(--out); }
  .tip { position: fixed; pointer-events: none; background: var(--card); border: 1px solid var(--line);
         border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
         display: none; z-index: 10; }
  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-top: 14px; padding-bottom: 2px; }
  .tabs button { white-space: nowrap; border-radius: 10px 10px 0 0; border-bottom-width: 3px; }
  .tabs button.on { border-bottom-color: var(--out); font-weight: 600; }
  .tabs button.pending { opacity: .6; }
  .tabs button.add { font-weight: 700; }
  #tabHead { margin-bottom: 12px; }
  #tabHead h2 { font-size: 20px; }
  .codes { font-size: 13px; margin-top: 4px; }
  .codes b { font-weight: 600; }
  .tstat { font-size: 13px; margin-top: 6px; }
  .tstat.warn { color: #b45309; } .tstat.bad { color: var(--bad); }
  .linkbtn { background: none; border: none; color: var(--muted); padding: 0; font-size: 12px; text-decoration: underline; }
  .addform { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .ap { position: relative; }
  .aplabel { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .apchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .apchip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 99px;
            padding: 3px 4px 3px 10px; font-size: 13px; background: var(--bg); }
  .apchip.bad { border-color: var(--bad); color: var(--bad); }
  .apchip button { border: none; background: none; padding: 0 6px; font-size: 14px; color: var(--muted); }
  .apin { width: 100%; }
  .sugg { position: absolute; left: 0; right: 0; z-index: 5; background: var(--card); border: 1px solid var(--line);
          border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.12); max-height: 260px; overflow-y: auto; }
  .sugg:empty { display: none; }
  .sugg div { padding: 8px 10px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--line); }
  .sugg div:hover { background: var(--bg); }
  .near { font-size: 12px; margin-top: 6px; }
  .near button { font-size: 12px; padding: 2px 8px; margin: 2px 4px 0 0; }
  .addmsg { font-size: 13px; }
  @media (max-width: 600px) {
    .summary { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat { padding: 8px; font-size: 12px; }
    .stat .big { font-size: 18px; }
  }
</style>
</head>
<body>
<main>
  <h1>Цены на авиабилеты</h1>
  <div class="muted">Билеты в одну сторону, туда и обратно отдельно · данные Aviasales (кэш 2–7 дней), EUR</div>

  <nav class="tabs" id="tabs"></nav>

  <section class="card" id="addPanel" hidden>
    <div class="head"><h2>Новая вкладка</h2></div>
    <div class="addform">
      <label>Название <input id="addName" placeholder="например, Мюнхен" maxlength="40"></label>
      <div class="ap" data-k="from"><div class="aplabel">Откуда <span class="muted">— один или несколько аэропортов</span></div>
        <div class="apchips"></div><input class="apin" placeholder="город или код, например «хельс» или HEL" autocomplete="off"><div class="sugg"></div></div>
      <div class="ap" data-k="to"><div class="aplabel">Куда</div>
        <div class="apchips"></div><input class="apin" placeholder="город или код, например «барс» или BCN" autocomplete="off"><div class="sugg"></div><div class="near muted"></div></div>
      <div class="addmsg muted" id="addMsg"></div>
      <div class="dayrow"><button type="button" class="primary" id="addSave">Сохранить на GitHub</button><button type="button" id="addCancel">Отмена</button></div>
    </div>
  </section>

  <section class="card" id="mainCard">
    <div id="tabHead"></div>
    <form id="form">
      <label>Даты вылета
        <select id="window"></select>
      </label>
      <label>Пересадки
        <select id="tr"><option value="">Любые</option><option value="0">Только прямые</option><option value="1">Не больше 1</option></select>
      </label>
    </form>
    <div class="days">
      <div class="dayrow"><button type="button" id="matchBtn">⚽ Выходные под матч</button><button type="button" id="allDays">Все дни</button></div>
      <div class="dayrow"><span class="dlabel">Туда:</span><span class="chipset" data-dir="out"></span></div>
      <div class="dayrow"><span class="dlabel">Обратно:</span><span class="chipset" data-dir="back"></span></div>
    </div>
    <div class="status muted" id="status">Загрузка…</div>
  </section>

  <div id="dirs"></div>
</main>
<div class="tip" id="tip"></div>

<script>
const AVIASALES = "https://www.aviasales.com";
const DAY = 864e5;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtEur = v => "€" + Math.round(v).toLocaleString("ru-RU");
const fmtDate = s => new Date(s + "T00:00:00").toLocaleDateString("ru-RU", { weekday: "short", day: "numeric", month: "short" });
const fmtDT = s => new Date(s).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
// «сегодня в 20:54» / «вчера в 16:54» / «21 нояб. в 16:54»
const relDT = s => {
  const d = new Date(s), t = new Date(), y = addDays(t, -1), tm = addDays(t, 1);
  const hm = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  const same = (a, b) => a.toDateString() === b.toDateString();
  return `${same(d, t) ? "сегодня" : same(d, y) ? "вчера" : same(d, tm) ? "завтра" : d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" })} в ${hm}`;
};
const fmtDur = m => m ? `${Math.floor(m / 60)} ч ${String(m % 60).padStart(2, "0")} м` : "";
// Даты считаем в местном времени браузера (не через UTC: в Финляндии UTC+2,
// и toISOString() сдвигал полночь на предыдущий день).
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

let ALL = [], LAST = null, CFG = {}, TABS = [], TAB = null, NAMES = {};
const REPO = (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/), name = location.pathname.split("/").filter(Boolean)[0];
  return m && name ? `${m[1]}/${name}` : "obvmail-sys/flight-tracker";
})();
let BRANCH = "claude/flight-price-tracker-hel-bcn-228c06";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const legsOf = t => t.legs?.length ? t.legs : t.from.flatMap(o => t.to.filter(d => d !== o).flatMap(d => [`${o}-${d}`, `${d}-${o}`]));
const isMulti = () => TAB && (TAB.from.length > 1 || TAB.to.length > 1);
const codeName = c => NAMES[c] ? `${NAMES[c][1] || NAMES[c][0]}` : "";
// Фильтр дней недели (0 = вс … 6 = сб). Пустое множество = все дни.
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"], WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
const MATCH = { out: [5, 6], back: [0, 1] };  // туда пт/сб, обратно вс/пн
const DAYS = { out: new Set(), back: new Set() };
const wday = ds => new Date(ds + "T00:00:00").getDay();
const daysParam = set => [...set].sort().join("");
function drawDayChips() {
  document.querySelectorAll(".chipset").forEach(cs => {
    const set = DAYS[cs.dataset.dir];
    cs.innerHTML = WD_ORDER.map(d => `<button type="button" class="dchip${set.has(d) ? " on" : ""}" data-d="${d}">${WD[d]}</button>`).join("");
  });
  const isMatch = daysParam(DAYS.out) === daysParam(new Set(MATCH.out)) && daysParam(DAYS.back) === daysParam(new Set(MATCH.back));
  $("matchBtn").classList.toggle("on", isMatch);
}
const sortState = {};

async function load() {
  const bust = "?t=" + Date.now();
  LAST = await fetch("data/last_run.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null);
  CFG = LAST?.config || {};
  NAMES = LAST?.names || {};
  TABS = LAST?.tabs?.length ? LAST.tabs
    : (CFG.routes || [{ origin: "HEL", destination: "BCN" }]).map(r => ({ id: "hel-bcn", name: "Барселона", from: [r.origin], to: [r.destination] }));
  // вкладки, сохранённые с сайта, но ещё не собранные (ждут коммита/сбора)
  // ожидающая убирается, если уже есть сохранённая вкладка с тем же id или с теми же аэропортами
  const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const pend = LS.get("ft_pending", []).filter(p => Date.now() - p.ts < 3 * DAY &&
    !TABS.some(t => t.id === p.id || (sameSet(t.from, p.from) && sameSet(t.to, p.to))))
    .filter((p, i, arr) => arr.findIndex(q => sameSet(q.from, p.from) && sameSet(q.to, p.to)) === i);
  LS.set("ft_pending", pend);
  TABS = TABS.concat(pend.map(p => ({ ...p, pending: true })));
  fetch(`https://api.github.com/repos/${REPO}`).then(r => r.ok ? r.json() : null).then(j => { if (j?.default_branch) BRANCH = j.default_branch; }).catch(() => {});

  const cmin = CFG.collect_days_min ?? 0, cmax = CFG.collect_days_max ?? 180;
  const span = cmax - cmin, spanTxt = span % 30 === 0 ? `${span / 30} мес.` : `${span} дней`;
  let opts = `<option value="${cmin}-${cmax}">все: сегодня + ${spanTxt}</option>`;
  for (let a = cmin, i = 1; a < cmax; a += 30, i++) opts += `<option value="${a}-${Math.min(a + 30, cmax)}">${i}-й месяц (через ${a}–${Math.min(a + 30, cmax)} дней)</option>`;
  $("window").innerHTML = opts;

  // вкладка: из адреса (?tab=, или старые ?from=&to=), иначе последняя открытая, иначе первая
  const p = new URLSearchParams(location.search);
  let id = p.get("tab");
  if (!id && p.get("from")) id = TABS.find(t => t.from.includes(p.get("from").toUpperCase()) && t.to.includes((p.get("to") || "").toUpperCase()))?.id;
  if (!TABS.some(t => t.id === id)) id = LS.get("ft_tab", null);
  if (!TABS.some(t => t.id === id)) id = TABS[0]?.id;
  const urlState = p.get("tab") ? { w: p.get("w"), tr: p.get("tr") || "", out: p.get("out") || "", back: p.get("back") || "" } : null;
  await openTab(id, urlState);
}

// ---------- вкладки
const legCache = {};
let oldPrices = null;
async function loadLeg(leg) {
  if (legCache[leg]) return legCache[leg];
  const bust = "?t=" + Date.now();
  let rows = await fetch(`data/legs/${leg}.json${bust}`).then(r => r.ok ? r.json() : null).catch(() => null);
  if (!rows) {  // до первого сбора в новом формате — старый общий файл
    oldPrices ||= await fetch("data/prices.json" + bust).then(r => r.ok ? r.json() : []).catch(() => []);
    const [o, d] = leg.split("-");
    rows = oldPrices.filter(r => r.origin === o && r.destination === d && r.airline !== undefined);
  }
  return (legCache[leg] = rows);
}

function saveTabState() {
  if (!TAB) return;
  LS.set("ft_state_" + TAB.id, { w: $("window").value, tr: $("tr").value, out: daysParam(DAYS.out), back: daysParam(DAYS.back) });
}

async function openTab(id, state = null) {
  saveTabState();
  TAB = TABS.find(t => t.id === id) || TABS[0];
  LS.set("ft_tab", TAB.id);
  const st = state || LS.get("ft_state_" + TAB.id, {});
  if (st.w && [...$("window").options].some(o => o.value === st.w)) $("window").value = st.w; else $("window").selectedIndex = 0;
  $("tr").value = st.tr || "";
  for (const k of ["out", "back"]) DAYS[k] = new Set((st[k] || "").split("").filter(c => /[0-6]/.test(c)).map(Number));
  drawDayChips();
  drawTabs();
  $("status").textContent = "Загрузка…";
  ALL = (await Promise.all(legsOf(TAB).map(loadLeg))).flat();
  show();
}

function drawTabs() {
  $("tabs").innerHTML = TABS.map(t => `<button type="button" data-tab="${esc(t.id)}" class="${t.id === TAB?.id ? "on" : ""}${t.pending ? " pending" : ""}">${t.pending ? "⏳ " : ""}${esc(t.name)}</button>`).join("")
    + `<button type="button" class="add" id="addTab" title="Новая вкладка">＋</button>`;
}

function drawTabHead() {
  const t = TAB, ls = LAST?.tabs?.find(x => x.id === t.id);
  const codes = arr => arr.map(c => `<b>${esc(c)}</b>${codeName(c) ? " " + esc(codeName(c)) : ""}`).join(", ");
  let stat = "", cls = "";
  if (t.pending || !ls) { stat = "⏳ Ждёт первого сбора — обычно 1–2 минуты после «Commit changes» на GitHub. Потом обновите страницу."; cls = "warn"; }
  else {
    const parts = legsOf(ls).map(l => `${l.replace("-", "→")} ${ls.found?.[l] ?? 0}`);
    const empty = legsOf(ls).filter(l => !(ls.found?.[l]));
    if (ls.unknown?.length) { stat = `❌ Неизвестные коды: ${ls.unknown.join(", ")} — их нет в справочнике аэропортов, по ним поиск не идёт. `; cls = "bad"; }
    if (ls.error) { stat += `❌ Файл вкладки ${ls.error}. `; cls = "bad"; }
    if (ls.failed_legs?.length) { stat += `❌ Ошибка API по: ${ls.failed_legs.join(", ")}. `; cls = "bad"; }
    if (!cls && empty.length === legsOf(ls).length && legsOf(ls).length) { stat = "⚠️ Коды правильные, API отвечает, но цен в кэше Aviasales по этому направлению пока нет. "; cls = "warn"; }
    stat += `${cls ? "" : "✅ "}Найдено при последней проверке: ${parts.join(" · ") || "—"}`;
  }
  $("tabHead").innerHTML = `<div class="head"><h2>${esc(t.name)}</h2></div>
    <div class="codes">Откуда: ${codes(t.from)}<br>Куда: ${codes(t.to)}</div>
    <div class="tstat ${cls}">${stat}</div>
    <div style="margin-top:6px"><button type="button" class="linkbtn" id="delTab">Удалить вкладку</button></div>`;
  $("delTab").addEventListener("click", () => {
    if (t.pending) { LS.set("ft_pending", LS.get("ft_pending", []).filter(p => p.id !== t.id)); location.reload(); return; }
    if (!confirm(`Удалить вкладку «${t.name}»?\n\nОткроется GitHub — там нажмите зелёную кнопку «Commit changes».`)) return;
    window.open(`https://github.com/${REPO}/delete/${BRANCH}/routes/${encodeURIComponent(t.id)}.json`, "_blank");
  });
}

function show() {
  if (!TAB) return;
  const w = $("window").value, tr = $("tr").value;
  history.replaceState(null, "", `?tab=${encodeURIComponent(TAB.id)}&w=${w}${tr ? "&tr=" + tr : ""}` +
    (DAYS.out.size ? "&out=" + daysParam(DAYS.out) : "") + (DAYS.back.size ? "&back=" + daysParam(DAYS.back) : ""));
  saveTabState();
  drawTabHead();

  const [d0, d1] = w.split("-").map(Number);
  const today = new Date(new Date().toDateString());
  const wFrom = iso(addDays(today, d0)), wTo = iso(addDays(today, d1));

  const st = $("status"); st.classList.remove("err"); st.title = "";
  let s = LAST ? `Последняя проверка: ${relDT(LAST.checked_at)} · следующая около ${relDT(new Date(+new Date(LAST.checked_at) + 4 * 3600e3).toISOString())}` : "";
  s += ` · вылеты ${fmtDate(wFrom)} – ${fmtDate(wTo)}`;
  st.textContent = s;

  const F = TAB.from, T = TAB.to, label = arr => arr.join(", ");
  $("dirs").innerHTML = "";
  renderWeekends(F, T, wFrom, wTo, tr);
  const a = renderDirection(F, T, "Туда", "var(--out)", wFrom, wTo, tr, DAYS.out);
  const b = renderDirection(T, F, "Обратно", "var(--back)", wFrom, wTo, tr, DAYS.back);
  renderCompare(a, b, wFrom, wTo);
}

function currentRows(os, ds, wFrom, wTo, tr, days = null) {
  const leg = ALL.filter(r => os.includes(r.origin) && ds.includes(r.destination));
  const latest = {};  // последняя проверка — отдельно по каждому направлению (паре аэропортов)
  for (const r of leg) { const k = r.origin + r.destination; if (!latest[k] || r.last_seen_at > latest[k]) latest[k] = r.last_seen_at; }
  const rows = leg.filter(r => r.last_seen_at === latest[r.origin + r.destination] && r.departure_date >= wFrom && r.departure_date <= wTo
                               && (tr === "" || (r.transfers ?? 9) <= +tr)
                               && (!days || !days.size || days.has(wday(r.departure_date))));
  for (const r of rows) {  // изменение цены на ту же дату с прошлых проверок
    // тот же рейс (авиакомпания + номер) на ту же дату, найденный раньше
    const prev = leg.filter(x => x !== r && x.origin === r.origin && x.destination === r.destination
                                 && x.departure_date === r.departure_date && x.checked_at < r.checked_at
                                 && x.airline === r.airline && x.flight_number === r.flight_number
                                 && (x.transfers ?? 0) === (r.transfers ?? 0))
      .reduce((m, x) => (!m || x.last_seen_at > m.last_seen_at ? x : m), null);
    r.change = prev ? r.price_eur - prev.price_eur : 0;
  }
  return rows;
}

// Самая низкая цена на каждую дату + линейная регрессия (МНК) по ним.
function minPerDate(rows) {
  const best = {};
  for (const r of rows) if (!best[r.departure_date] || r.price_eur < best[r.departure_date]) best[r.departure_date] = r.price_eur;
  return Object.entries(best).map(([d, y]) => ({ x: +new Date(d + "T00:00:00") / DAY, y }));
}
function trend(rows) {
  const pts = minPerDate(rows);
  if (pts.length < 2) return null;
  const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
  const sxx = pts.reduce((a, p) => a + (p.x - mx) ** 2, 0);
  if (!sxx) return null;
  const k = pts.reduce((a, p) => a + (p.x - mx) * (p.y - my), 0) / sxx; // €/день
  return { k, b: my - k * mx, n };
}

// LOWESS: локальная взвешенная линейная регрессия (трикуб-веса) по самой низкой цене
// каждого дня + 2 итерации устойчивости (бисквадрат) против одиночных выбросов.
// Возвращает сглаженные значения в датах, где есть данные; между ними кривую
// проводит монотонный кубический сплайн (плавно и без выбросов, в т.ч. через пропуски).
const LOWESS_FRAC = 0.35, MIN_BW = 10;  // MIN_BW — минимальная ширина окна сглаживания, дней
function lowess(rows) {
  const pts = minPerDate(rows).sort((a, b) => a.x - b.x);
  const n = pts.length;
  if (n < 4) return null;
  const k = Math.min(n, Math.max(4, Math.ceil(LOWESS_FRAC * n)));
  let robust = new Array(n).fill(1);
  const fitAt = (x0) => {
    const d = pts.map(p => Math.abs(p.x - x0));
    const h = Math.max([...d].sort((a, b) => a - b)[k - 1], MIN_BW) * 1.0001;
    let sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0, lo = Infinity, hi = -Infinity;
    pts.forEach((p, i) => {
      const u = d[i] / h; if (u >= 1) return;
      const w = (1 - u ** 3) ** 3 * robust[i];
      if (w <= 0) return;
      sw += w; sx += w * p.x; sy += w * p.y; sxx += w * p.x * p.x; sxy += w * p.x * p.y;
      lo = Math.min(lo, p.y); hi = Math.max(hi, p.y);
    });
    if (!sw) return null;
    const mx = sx / sw, my = sy / sw, vx = sxx / sw - mx * mx;
    const y = vx > 1e-9 ? my + (sxy / sw - mx * my) / vx * (x0 - mx) : my;
    return Math.min(hi, Math.max(lo, y));  // не выходить за цены соседних точек
  };
  for (let it = 0; it < 2; it++) {
    const res = pts.map(p => p.y - (fitAt(p.x) ?? p.y));
    const med = [...res.map(Math.abs)].sort((a, b) => a - b)[Math.floor(n / 2)] || 1;
    robust = res.map(r => { const u = r / (6 * med); return Math.abs(u) < 1 ? (1 - u * u) ** 2 : 0; });
  }
  return pts.map(p => ({ x: p.x, y: Math.max(0, fitAt(p.x) ?? p.y) }));
}

// Плавная кривая через сглаженные точки: монотонный кубический сплайн (Фритч–Карлсон),
// одна непрерывная линия. Светлая подложка отделяет её от точек.
function curvePaths(curve, X, Y, color, width = 2) {
  if (!curve || curve.length < 2) return "";
  const xs = curve.map(p => p.x), ys = curve.map(p => p.y), n = xs.length;
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], t = a * a + b * b;
    if (t > 9) { const k = 3 / Math.sqrt(t); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  const P = (x, y) => `${X(x * DAY).toFixed(1)},${Y(y).toFixed(1)}`;
  let path = `M${P(xs[0], ys[0])}`;
  for (let i = 0; i < n - 1; i++) {
    const h = xs[i + 1] - xs[i];
    path += ` C${P(xs[i] + h / 3, ys[i] + m[i] * h / 3)} ${P(xs[i + 1] - h / 3, ys[i + 1] - m[i + 1] * h / 3)} ${P(xs[i + 1], ys[i + 1])}`;
  }
  return `<path d="${path}" fill="none" stroke="var(--card)" stroke-width="${width + 3}" stroke-linecap="round" stroke-opacity=".9"/>
          <path d="${path}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function renderDirection(o, d, title, color, wFrom, wTo, tr, days) {
  const rows = currentRows(o, d, wFrom, wTo, tr, days);
  const id = `${TAB.id}:${title}`;
  const sec = document.createElement("section");
  sec.className = "card";
  const best = [...rows].sort((a, b) => a.price_eur - b.price_eur)[0];
  const t = trend(rows);
  let trHtml = `<div class="big muted">—</div><div class="muted">нужно хотя бы 2 даты</div>`;
  if (t) {
    const per10 = t.k * 10, cls = per10 < -0.5 ? "down" : per10 > 0.5 ? "up" : "muted";
    const word = per10 < -0.5 ? "дальше дешевле" : per10 > 0.5 ? "дальше дороже" : "ровно";
    trHtml = `<div class="big ${cls}">${per10 > 0.05 ? "+" : per10 < -0.05 ? "−" : ""}€${Math.abs(per10).toFixed(1)}</div>
              <div class="muted">за 10 дней · ${word}</div>`;
  }
  sec.innerHTML = `
    <div class="head"><span class="bar" style="background:${color}"></span><h2>${title}: ${o.join(", ")} → ${d.join(", ")}</h2>${days && days.size ? `<span class="muted">· только ${WD_ORDER.filter(x => days.has(x)).map(x => WD[x]).join(", ")}</span>` : ""}</div>
    <div class="summary">
      <div class="stat"><div class="muted">Самая низкая цена</div>` + (best
        ? `<div class="big">${fmtEur(best.price_eur)}</div><div class="muted">${fmtDate(best.departure_date)} · ${esc(best.airline)}</div>`
        : `<div class="big muted">—</div><div class="muted">нет данных</div>`) + `</div>
      <div class="stat"><div class="muted">Тренд цены</div>${trHtml}</div>
      <div class="stat"><div class="muted">Найдено рейсов</div><div class="big">${rows.length}</div>
        <div class="muted">на ${((n) => n + " дат" + plural(n, "у", "ы", ""))(new Set(rows.map(r => r.departure_date)).size)}</div></div>
    </div>
    <div class="mstrip"></div>
    <div class="legend"><span><i class="dot" style="background:${color};opacity:.4"></i>Цена рейса</span><span><i class="dash"></i>Линейный тренд</span><span><i class="curve" style="border-color:${color === "var(--out)" ? "var(--out-dark)" : "var(--back-dark)"}"></i>Плавная кривая</span></div>
    <div class="chart"></div>
    <div class="hint muted">Нажмите на точку графика, чтобы увидеть рейсы этого дня</div>
    <div class="daybox" hidden></div>
    <h3>Топ-${TOP_N} самых дешёвых</h3>
    <div class="top"></div>
    <h3>Все рейсы по месяцам <span class="muted">(${rows.length})</span></h3>
    <div class="months"></div>`;
  $("dirs").append(sec);
  renderChart(sec.querySelector(".chart"), rows, color, wFrom, wTo, t);
  const ss = sortState[id] ||= { key: "departure_date", dir: 1, open: new Set(), day: null };
  const lists = () => renderLists(sec, rows, ss);
  sec.addEventListener("click", e => {
    const th = e.target.closest("th[data-sort]");
    if (th && th.closest(".months")) {  // сортировка внутри месяцев
      ss.dir = ss.key === th.dataset.sort ? -ss.dir : 1; ss.key = th.dataset.sort; lists(); return;
    }
    const pt = e.target.closest("[data-date]");
    if (pt) { ss.day = pt.dataset.date; renderDay(sec, rows, ss); return; }
    if (e.target.closest(".dayclose")) { ss.day = null; renderDay(sec, rows, ss); }
  });
  sec.querySelector(".months").addEventListener("toggle", e => {
    const m = e.target.dataset.month; if (!m) return;
    e.target.open ? ss.open.add(m) : ss.open.delete(m);
  }, true);
  lists();
  renderDay(sec, rows, ss);
  renderMonthStrip(sec, rows, wFrom, wTo, ss, lists);
  return { rows, t };
}

// Самая низкая цена по каждому календарному месяцу окна; нажатие раскрывает месяц в списке.
function renderMonthStrip(sec, rows, wFrom, wTo, ss, lists) {
  const months = [];
  for (let d = new Date(wFrom.slice(0, 7) + "-01T00:00:00"); iso(d) <= wTo; d = new Date(d.getFullYear(), d.getMonth() + 1, 1))
    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  const mins = months.map(m => {
    const g = rows.filter(r => r.departure_date.startsWith(m));
    return { m, n: g.length, min: g.length ? Math.min(...g.map(r => r.price_eur)) : null };
  });
  const best = Math.min(...mins.filter(x => x.min != null).map(x => x.min));
  const el = sec.querySelector(".mstrip");
  el.innerHTML = `<div class="muted" style="font-size:12px;margin:12px 0 4px">Самая низкая цена по месяцам</div><div class="chips">` +
    mins.map(x => `<button type="button" class="chip${x.min === best ? " best" : ""}" data-m="${x.m}" ${x.n ? "" : "disabled"}>
        <span>${MONTHS[+x.m.slice(5) - 1].slice(0, 3)}</span><b>${x.min != null ? fmtEur(x.min) : "—"}</b>
        <small class="muted">${x.n ? x.n + " рейс" + plural(x.n) : "нет данных"}</small></button>`).join("") + `</div>`;
  el.querySelectorAll(".chip[data-m]").forEach(b => b.addEventListener("click", () => {
    ss.open.add(b.dataset.m); lists();
    sec.querySelector(`details.month[data-month="${b.dataset.m}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

// Подписи оси дат на «круглых» датах: при окне > 2 мес — 1-е число каждого месяца,
// иначе 1, 10 и 20 число. Тонкие вертикальные линии помогают понять, где точка.
const MON_SHORT = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
function xTicks(x0, x1, X, H, P, W) {
  const days = (x1 - x0) / DAY, ticks = [];
  const d = new Date(x0); d.setDate(1);
  for (; +d <= x1; d.setMonth(d.getMonth() + 1)) {
    for (const day of days > 62 ? [1] : [1, 10, 20]) {
      const t = new Date(d.getFullYear(), d.getMonth(), day);
      if (+t >= x0 && +t <= x1) ticks.push(t);
    }
  }
  let g = "", lastX = -1e9;
  const minGap = days > 62 ? 34 : 40;
  for (const t of ticks) {
    const x = X(+t);
    g += `<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H - P.b}" stroke="var(--line)" stroke-dasharray="${t.getDate() === 1 ? "" : "2 4"}"/>`;
    if (x - lastX < minGap || x > W - 12) continue;
    lastX = x;
    const label = `${t.getDate()} ${MON_SHORT[t.getMonth()]}`;
    g += `<text x="${x}" y="${H - 8}" text-anchor="middle">${label}</text>`;
  }
  return g;
}

function renderChart(el, rows, color, wFrom, wTo, t) {
  if (!rows.length) {
    el.innerHTML = `<div class="muted">${$("tr").value !== ""
      ? "Под фильтр пересадок ничего не подошло — попробуйте «Пересадки: Любые»."
      : "В этом окне дат цен в кэше Aviasales пока нет — попробуйте «Даты вылета: все»."}</div>`;
    return;
  }
  const W = Math.max(320, el.clientWidth || 800), H = 260, P = { l: 48, r: 14, t: 12, b: 28 };
  const x0 = +new Date(wFrom + "T00:00:00"), x1 = +new Date(wTo + "T00:00:00");
  // шкала без редких выбросов: верх = min(максимум, Q3 + 3·IQR); выбросы рисуем треугольником у верхнего края
  const ys = rows.map(r => r.price_eur).sort((a, b) => a - b);
  const q = f => ys[Math.min(ys.length - 1, Math.floor(f * (ys.length - 1)))];
  const cap = ys.length >= 8 ? Math.min(ys[ys.length - 1], q(.75) + 3 * (q(.75) - q(.25))) : ys[ys.length - 1];
  let y0 = ys[0], y1 = cap; const pad = (y1 - y0) * 0.15 || 20; y0 = Math.max(0, y0 - pad); y1 += pad;
  const X = x => P.l + (x - x0) / (x1 - x0 || DAY) * (W - P.l - P.r);
  const Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4;
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">€${Math.round(v)}</text>`;
  }
  g += xTicks(x0, x1, X, H, P, W);
  if (t) {
    const ya = t.k * (x0 / DAY) + t.b, yb = t.k * (x1 / DAY) + t.b;
    g += `<line x1="${X(x0)}" y1="${Y(ya)}" x2="${X(x1)}" y2="${Y(yb)}" stroke="var(--trend)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  }
  let pointsSvg = "";
  for (const r of rows) {
    const tip = `${fmtDate(r.departure_date)} ${r.departure_time || ""}: ${fmtEur(r.price_eur)} · ${r.airline || ""}, пересадок ${r.transfers ?? "?"}`;
    const cx = X(+new Date(r.departure_date + "T00:00:00"));
    pointsSvg += r.price_eur > cap
      ? `<path d="M${cx - 6} ${P.t + 10} L${cx + 6} ${P.t + 10} L${cx} ${P.t} Z" fill="${color}" fill-opacity=".45" data-date="${r.departure_date}" data-tip="${esc(tip + " (выше шкалы)")}"/>`
      : `<circle cx="${cx}" cy="${Y(r.price_eur)}" r="4.5" fill="${color}" fill-opacity=".3" stroke="transparent" stroke-width="10" data-date="${r.departure_date}" data-tip="${esc(tip)}"/>`;
  }
  // светлые точки, поверх — насыщенная кривая (тёмный оттенок цвета направления)
  const cv = lowess(rows)?.map(p => ({ ...p, y: Math.min(p.y, y1) }));
  g += pointsSvg + `<g pointer-events="none">${curvePaths(cv, X, Y, color === "var(--out)" ? "var(--out-dark)" : "var(--back-dark)")}</g>`;
  el.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Цена по дате вылета">${g}</svg>`;
}

// ---------- График 3: сравнение «туда» и «обратно» — только линии, без точек
const cmpShow = { outCurve: true, backCurve: true, outLine: true, backLine: true };
function renderCompare(a, b, wFrom, wTo) {
  const sec = document.createElement("section");
  sec.className = "card";
  sec.innerHTML = `
    <div class="head"><h2>Сравнение: туда и обратно</h2></div>
    <div class="muted hint" style="margin-top:4px">Плавные кривые и прямые тренды обоих направлений на одной шкале. Где кривые близко — цены туда и обратно в эти даты похожи; где обе низко — дёшево в обе стороны.</div>
    <div class="toggles">
      <label><input type="checkbox" data-k="outCurve"><i class="curve" style="border-color:var(--out)"></i>Туда — кривая</label>
      <label><input type="checkbox" data-k="backCurve"><i class="curve" style="border-color:var(--back)"></i>Обратно — кривая</label>
      <label><input type="checkbox" data-k="outLine"><i class="dash" style="border-color:var(--out)"></i>Туда — прямая</label>
      <label><input type="checkbox" data-k="backLine"><i class="dash" style="border-color:var(--back)"></i>Обратно — прямая</label>
    </div>
    <div class="chart cmp"></div>`;
  $("dirs").append(sec);
  sec.querySelectorAll("input[data-k]").forEach(i => {
    i.checked = cmpShow[i.dataset.k];
    i.addEventListener("change", () => { cmpShow[i.dataset.k] = i.checked; draw(); });
  });
  const ca = lowess(a.rows), cb = lowess(b.rows);
  const draw = () => {
    const el = sec.querySelector(".cmp");
    const x0 = +new Date(wFrom + "T00:00:00"), x1 = +new Date(wTo + "T00:00:00");
    const lineY = t => t ? [t.k * (x0 / DAY) + t.b, t.k * (x1 / DAY) + t.b] : [];
    const vals = [
      ...(cmpShow.outCurve && ca ? ca.map(p => p.y) : []),
      ...(cmpShow.backCurve && cb ? cb.map(p => p.y) : []),
      ...(cmpShow.outLine ? lineY(a.t) : []), ...(cmpShow.backLine ? lineY(b.t) : []),
    ];
    if (!vals.length) { el.innerHTML = '<div class="muted">Недостаточно данных для кривых (нужно хотя бы 4 даты в каждом направлении) — или все линии выключены.</div>'; return; }
    const W = Math.max(320, el.clientWidth || 800), H = 260, P = { l: 48, r: 14, t: 12, b: 28 };
    let y0 = Math.min(...vals), y1 = Math.max(...vals); const pad = (y1 - y0) * 0.15 || 20; y0 = Math.max(0, y0 - pad); y1 += pad;
    const X = x => P.l + (x - x0) / (x1 - x0 || DAY) * (W - P.l - P.r);
    const Y = y => H - P.b - (Math.min(Math.max(y, y0), y1) - y0) / (y1 - y0) * (H - P.t - P.b);
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = y0 + (y1 - y0) * i / 4;
      g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">€${Math.round(v)}</text>`;
    }
    g += xTicks(x0, x1, X, H, P, W);
    const line = (t, color) => { const [ya, yb] = lineY(t); return t ? `<line x1="${X(x0)}" y1="${Y(ya)}" x2="${X(x1)}" y2="${Y(yb)}" stroke="${color}" stroke-width="1.5" stroke-dasharray="6 5"/>` : ""; };
    if (cmpShow.outLine) g += line(a.t, "var(--out)");
    if (cmpShow.backLine) g += line(b.t, "var(--back)");
    if (cmpShow.outCurve) g += curvePaths(ca, X, Y, "var(--out)");
    if (cmpShow.backCurve) g += curvePaths(cb, X, Y, "var(--back)");
    el.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Сравнение туда и обратно">${g}</svg>`;
  };
  draw();
}

const TOP_N = 10;
const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];

function sortRows(rows, ss) {
  return [...rows].sort((a, b) => {
    const va = a[ss.key] ?? "", vb = b[ss.key] ?? "";
    return (typeof va === "number" && typeof vb === "number" ? va - vb : String(va).localeCompare(String(vb))) * ss.dir
      || a.departure_date.localeCompare(b.departure_date) || a.price_eur - b.price_eur;
  });
}
const byPrice = rows => [...rows].sort((a, b) => a.price_eur - b.price_eur || a.departure_date.localeCompare(b.departure_date));

function tableHtml(rows, { sortable = false, minByDate = {} } = {}) {
  const th = (k, label, cls = "") => `<th ${sortable && k ? `data-sort="${k}"` : ""} class="${cls}">${label}</th>`;
  return `<div class="tablewrap"><table><thead><tr>
      ${th("departure_date", "Дата")}${th("departure_time", "Время")}${th("price_eur", "Цена", "num")}
      ${th("change", "Изм.", "num")}${th("airline", "Авиакомпания")}${th("transfers", "Пересадки", "num")}
      ${th("duration_min", "В пути", "num")}${th("", "Купить")}
    </tr></thead><tbody>` +
    (rows.map(r => `<tr class="${r.price_eur === minByDate[r.departure_date] ? "cheap" : ""}">
      <td>${fmtDate(r.departure_date)}${isMulti() ? `<div class="muted" style="font-size:11px">${r.origin}→${r.destination}</div>` : ""}</td>
      <td>${esc(r.departure_time || "")}</td>
      <td class="num"><b>${fmtEur(r.price_eur)}</b></td>
      <td class="num ${r.change < 0 ? "down" : r.change > 0 ? "up" : "muted"}">${r.change ? (r.change > 0 ? "+" : "−") + Math.abs(Math.round(r.change)) : "·"}</td>
      <td>${esc(r.airline)}${r.flight_number ? " " + esc(r.flight_number) : ""}</td>
      <td class="num">${r.transfers ?? "?"}</td>
      <td class="num">${fmtDur(r.duration_min)}</td>
      <td>${r.link ? `<a href="${esc(AVIASALES + r.link)}" target="_blank" rel="noopener">Aviasales →</a>` : ""}</td>
    </tr>`).join("") || `<tr><td colspan="8" class="muted">Нет рейсов</td></tr>`) +
    `</tbody></table></div>`;
}

function renderLists(sec, rows, ss) {
  const minByDate = {};
  for (const r of rows) minByDate[r.departure_date] = Math.min(minByDate[r.departure_date] ?? Infinity, r.price_eur);

  sec.querySelector(".top").innerHTML = tableHtml(byPrice(rows).slice(0, TOP_N));

  const groups = {};
  for (const r of rows) (groups[r.departure_date.slice(0, 7)] ||= []).push(r);
  sec.querySelector(".months").innerHTML = Object.keys(groups).sort().map(m => {
    const g = groups[m], min = Math.min(...g.map(r => r.price_eur));
    const name = MONTHS[+m.slice(5) - 1] + (m.slice(0, 4) !== String(new Date().getFullYear()) ? " " + m.slice(0, 4) : "");
    return `<details class="month" data-month="${m}" ${ss.open.has(m) ? "open" : ""}>
      <summary><b>${name}</b><span>— от ${fmtEur(min)}</span><span class="muted">· ${g.length} рейс${plural(g.length)} · ${((n) => n + " дат" + plural(n, "а", "ы", ""))(new Set(g.map(r => r.departure_date)).size)}</span></summary>
      ${tableHtml(sortRows(g, ss), { sortable: true, minByDate })}
    </details>`;
  }).join("") || '<div class="muted">Нет рейсов</div>';
}

function renderDay(sec, rows, ss) {
  const box = sec.querySelector(".daybox");
  const day = ss.day && rows.filter(r => r.departure_date === ss.day);
  if (!day || !day.length) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = `<div class="dayhead"><b>Рейсы на ${fmtDate(ss.day)} (${day.length})</b>
      <button type="button" class="dayclose" aria-label="Закрыть">✕</button></div>` + tableHtml(byPrice(day));
}

const plural = (n, one = "", few = "а", many = "ов") =>
  (n % 10 === 1 && n % 100 !== 11) ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? few : many;

// ---------- Блок «Выходные под матч»: для каждого воскресенья окна — 4 комбинации
// туда пт/сб × обратно вс/пн, по самому дешёвому рейсу на дату (с учётом фильтра пересадок).
const COMBOS = [[-2, 0, "пт → вс"], [-2, 1, "пт → пн"], [-1, 0, "сб → вс"], [-1, 1, "сб → пн"]];
const wkOpen = new Set();
function renderWeekends(from, to, wFrom, wTo, tr) {
  const ext = (ds, n) => iso(addDays(new Date(ds + "T00:00:00"), n));
  const cheapest = rows => { const m = {}; for (const r of rows) if (!m[r.departure_date] || r.price_eur < m[r.departure_date].price_eur) m[r.departure_date] = r; return m; };
  const outBy = cheapest(currentRows(from, to, ext(wFrom, -2), wTo, tr));
  const backBy = cheapest(currentRows(to, from, wFrom, ext(wTo, 1), tr));

  const weeks = [];
  let sun = new Date(wFrom + "T00:00:00"); sun = addDays(sun, (7 - sun.getDay()) % 7);
  for (; iso(sun) <= wTo; sun = addDays(sun, 7)) {
    const su = iso(sun);
    const combos = COMBOS.map(([dOut, dBack, label]) => {
      const a = outBy[ext(su, dOut)], b = backBy[ext(su, dBack)];
      return { label, a, b, total: a && b ? a.price_eur + b.price_eur : null };
    });
    const ok = combos.filter(c => c.total != null);
    weeks.push({ su, combos, best: ok.length ? ok.reduce((m, c) => c.total < m.total ? c : m) : null });
  }
  const full = weeks.filter(w => w.best);
  const cheapestWeek = full.length ? full.reduce((m, w) => w.best.total < m.best.total ? w : m) : null;

  const sec = document.createElement("section");
  sec.className = "card";
  const leg = (r, dir) => r
    ? `${dir} ${fmtDate(r.departure_date)} ${esc(r.departure_time || "")}${isMulti() ? ` · ${r.origin}→${r.destination}` : ""} · ${fmtEur(r.price_eur)} · ${esc(r.airline || "")}${r.transfers ? `, ${r.transfers} пер.` : ", прямой"}` +
      (r.link ? ` <a href="${esc(AVIASALES + r.link)}" target="_blank" rel="noopener">купить</a>` : "")
    : `${dir} — нет цены в кэше`;
  sec.innerHTML = `
    <div class="head"><span class="bar" style="background:var(--good)"></span><h2>⚽ Выходные под матч</h2></div>
    <div class="muted hint" style="margin-top:4px">Для каждого воскресенья: туда в пятницу или субботу, обратно в воскресенье или понедельник — 4 комбинации, сумма двух билетов в одну сторону.
      Полных вариантов: ${full.length} из ${weeks.length} выходных.</div>
    <div class="legend"><span><i class="dot" style="background:var(--good);opacity:.4"></i>Цена поездки (лучшая комбинация)</span><span><i class="curve" style="border-color:var(--good)"></i>Плавная кривая</span></div>
    <div class="chart wkchart"></div>
    <div class="wklist"></div>`;
  $("dirs").append(sec);

  // график: лучшая сумма по выходным + плавная кривая
  const el = sec.querySelector(".wkchart");
  if (full.length) {
    const W = Math.max(320, el.clientWidth || 800), H = 220, P = { l: 48, r: 14, t: 12, b: 28 };
    const x0 = +new Date(wFrom + "T00:00:00"), x1 = +new Date(wTo + "T00:00:00");
    const ys = full.map(w => w.best.total);
    let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.15 || 20; y0 = Math.max(0, y0 - pad); y1 += pad;
    const X = x => P.l + (x - x0) / (x1 - x0 || DAY) * (W - P.l - P.r);
    const Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
    let g = "";
    for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">€${Math.round(v)}</text>`; }
    g += xTicks(x0, x1, X, H, P, W);
    const pseudo = full.map(w => ({ departure_date: w.su, price_eur: w.best.total }));
    for (const w of full) g += `<circle cx="${X(+new Date(w.su + "T00:00:00"))}" cy="${Y(w.best.total)}" r="5" fill="var(--good)" fill-opacity=".35" stroke="transparent" stroke-width="10" data-wk="${w.su}" data-tip="${esc(`вс ${fmtDate(w.su)}: ${fmtEur(w.best.total)} (${w.best.label})`)}" style="cursor:pointer"/>`;
    g += `<g pointer-events="none">${curvePaths(lowess(pseudo), X, Y, "var(--good)")}</g>`;
    el.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Цена поездки по выходным">${g}</svg>`;
  } else el.innerHTML = '<div class="muted">Пока нет выходных, где в кэше есть и «туда», и «обратно».</div>';

  // список выходных: полные — раскрываемые карточки; без данных — одной строкой
  const empty = weeks.length - full.length;
  sec.querySelector(".wklist").innerHTML = full.map(w => {
    const cheapAll = Math.min(...w.combos.filter(c => c.total != null).map(c => c.total));
    return `<details class="wk${w === cheapestWeek ? " best" : ""}" data-su="${w.su}" ${wkOpen.has(w.su) ? "open" : ""}>
      <summary><b>${fmtDate(ext(w.su, -1))} – ${fmtDate(w.su)}</b><span>от <b>${fmtEur(w.best.total)}</b></span>
        <span class="muted">${w.best.label}${w === cheapestWeek ? " · самые дешёвые выходные" : ""}</span></summary>
      <div class="wkbody">${w.combos.map(c => `<div class="combo${c.total === cheapAll ? " top" : ""}${c.total == null ? " none" : ""}">
          <b>${c.label}</b> ${c.total != null ? `— <b>${fmtEur(c.total)}</b>` : "— нет полной пары"}${c.label === "сб → пн" ? ' <span class="muted">★ удобнее всего</span>' : ""}
          <div class="legs">${leg(c.a, "туда")}<br>${leg(c.b, "обратно")}</div></div>`).join("")}</div>
    </details>`;
  }).join("") + (empty ? `<div class="muted hint" style="margin-top:8px">Выходных без полной пары цен: ${empty} — появятся, когда в кэше будут и «туда», и «обратно».</div>` : "");
  sec.querySelectorAll("details.wk").forEach(d => d.addEventListener("toggle", () => d.open ? wkOpen.add(d.dataset.su) : wkOpen.delete(d.dataset.su)));
  sec.querySelectorAll("[data-wk]").forEach(c => c.addEventListener("click", () => {
    const d = sec.querySelector(`details.wk[data-su="${c.dataset.wk}"]`); if (!d) return;
    d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" });
  }));
}
// На телефонах «resize» срабатывает при показе/скрытии адресной строки во время

// ---------- форма «Новая вкладка»
let AIRPORTS = null;            // [код, аэропорт, город, страна, lat, lon]
const ADD = { from: [], to: [] };
async function loadAirports() {
  if (AIRPORTS) return AIRPORTS;
  const j = await fetch("data/airports.json").then(r => r.ok ? r.json() : null).catch(() => null);
  AIRPORTS = j?.airports || [];
  return AIRPORTS;
}
const apByCode = c => AIRPORTS?.find(a => a[0] === c);
const km = (a, b) => {
  const R = 6371, r = Math.PI / 180, dLat = (b[4] - a[4]) * r, dLon = (b[5] - a[5]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[4] * r) * Math.cos(b[4] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const apText = a => `${a[0]} — ${a[1]}${a[2] && !a[1].includes(a[2]) ? ", " + a[2] : ""}${a[3] ? ", " + a[3] : ""}`;

async function openAdd() {
  $("mainCard").hidden = true; $("dirs").hidden = true; $("addPanel").hidden = false;
  ADD.from = [...(TAB?.from || ["HEL"])]; ADD.to = [];
  $("addName").value = ""; $("addMsg").textContent = "Загружаю справочник аэропортов…";
  drawAdd();
  await loadAirports();
  $("addMsg").textContent = AIRPORTS.length ? "" : "Справочник аэропортов ещё не загружен (появится после следующего сбора) — можно вписать 3-буквенные коды, сборщик их проверит.";
  drawAdd();
  document.querySelector('.ap[data-k="to"] .apin').focus();
}
function closeAdd() { $("addPanel").hidden = true; $("mainCard").hidden = false; $("dirs").hidden = false; }

function drawAdd() {
  for (const k of ["from", "to"]) {
    const box = document.querySelector(`.ap[data-k="${k}"]`);
    box.querySelector(".apchips").innerHTML = ADD[k].map(c => {
      const a = apByCode(c), bad = AIRPORTS?.length && !a;
      return `<span class="apchip${bad ? " bad" : ""}">${esc(a ? apText(a) : c + (bad ? " — нет такого кода" : ""))}<button type="button" data-rm="${c}" aria-label="Убрать">✕</button></span>`;
    }).join("") || '<span class="muted" style="font-size:13px">не выбрано</span>';
  }
  // аэропорты рядом с выбранными «Куда» (до 150 км) — для групп вроде BCN + GRO + REU
  const near = document.querySelector('.ap[data-k="to"] .near');
  const sel = ADD.to.map(apByCode).filter(Boolean);
  const cand = !AIRPORTS?.length ? [] : AIRPORTS.filter(a => !ADD.to.includes(a[0]) && (a[4] || a[5]) && sel.some(b => km(a, b) < 150))
    .map(a => ({ a, d: Math.min(...sel.map(b => km(a, b))) })).sort((x, y) => x.d - y.d).slice(0, 6);
  near.innerHTML = cand.length ? "Рядом: " + cand.map(({ a, d }) => `<button type="button" data-add="${a[0]}">+ ${a[0]} ${esc(a[2] || a[1])} · ${Math.round(d)} км</button>`).join("") : "";
}

function suggest(input) {
  const box = input.closest(".ap"), k = box.dataset.k, q = input.value.trim().toLowerCase(), out = box.querySelector(".sugg");
  if (q.length < 2) { out.innerHTML = ""; return; }
  let list = [];
  if (AIRPORTS?.length) {
    const up = q.toUpperCase();
    const score = a => a[0] === up ? 0 : a[0].startsWith(up) ? 1 : (a[2] || "").toLowerCase().startsWith(q) ? 2 : a[1].toLowerCase().startsWith(q) ? 3 :
      ((a[2] || "").toLowerCase().includes(q) || a[1].toLowerCase().includes(q) || (a[3] || "").toLowerCase().startsWith(q)) ? 4 : 9;
    list = AIRPORTS.map(a => [score(a), a]).filter(x => x[0] < 9 && !ADD[k].includes(x[1][0])).sort((x, y) => x[0] - y[0]).slice(0, 8).map(x => x[1]);
    out.innerHTML = list.map(a => `<div data-pick="${a[0]}">${esc(apText(a))}</div>`).join("") || '<div class="muted">ничего не нашлось</div>';
  } else if (/^[a-z]{3}$/i.test(q)) {
    out.innerHTML = `<div data-pick="${q.toUpperCase()}">${q.toUpperCase()} — добавить (проверю при сборе)</div>`;
  }
}

document.querySelectorAll(".ap").forEach(box => {
  const k = box.dataset.k, input = box.querySelector(".apin");
  input.addEventListener("input", () => suggest(input));
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); box.querySelector("[data-pick]")?.click(); }
  });
  box.addEventListener("click", e => {
    const pick = e.target.closest("[data-pick]"), rm = e.target.closest("[data-rm]"), add = e.target.closest("[data-add]");
    if (pick) { ADD[k].push(pick.dataset.pick); input.value = ""; box.querySelector(".sugg").innerHTML = ""; drawAdd(); input.focus(); }
    if (rm) { ADD[k] = ADD[k].filter(c => c !== rm.dataset.rm); drawAdd(); }
    if (add) { ADD[k].push(add.dataset.add); drawAdd(); }
  });
});
document.addEventListener("click", e => { if (!e.target.closest(".ap")) document.querySelectorAll(".sugg").forEach(x => x.innerHTML = ""); });
$("addCancel").addEventListener("click", closeAdd);
$("addSave").addEventListener("click", () => {
  const name = $("addName").value.trim() || (ADD.to.map(c => apByCode(c)?.[2] || c)[0] ?? "");
  const msg = $("addMsg");
  const bad = AIRPORTS?.length ? [...ADD.from, ...ADD.to].filter(c => !apByCode(c)) : [];
  if (!ADD.from.length || !ADD.to.length) { msg.textContent = "Выберите хотя бы один аэропорт «Откуда» и один «Куда»."; return; }
  if (bad.length) { msg.textContent = `Уберите неизвестные коды: ${bad.join(", ")}.`; return; }
  if (!name) { msg.textContent = "Впишите название вкладки."; return; }
  // повторное сохранение той же вкладки (например, если GitHub не открылся) — тот же файл, без дубликатов
  const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const prevPending = LS.get("ft_pending", []).find(p => same(p.from, ADD.from) && same(p.to, ADD.to));
  let id = (ADD.from.join("-") + "_" + ADD.to.join("-")).toLowerCase(), base = id, i = 2;
  if (prevPending) id = prevPending.id;
  else while (TABS.some(t => t.id === id)) id = `${base}-${i++}`;
  const body = JSON.stringify({ name, from: ADD.from, to: ADD.to }, null, 2) + "\n";
  window.open(`https://github.com/${REPO}/new/${BRANCH}?filename=${encodeURIComponent("routes/" + id + ".json")}&value=${encodeURIComponent(body)}`, "_blank");
  LS.set("ft_pending", [...LS.get("ft_pending", []).filter(p => p.id !== id), { id, name, from: ADD.from, to: ADD.to, ts: Date.now() }]);
  msg.innerHTML = `<b>Почти готово.</b> На открывшейся странице GitHub нажмите зелёную кнопку <b>«Commit changes»</b> (и ещё раз в окошке).
    Через 1–2 минуты цены соберутся — обновите эту страницу, вкладка «${esc(name)}» появится. До этого она видна как «⏳».`;
  TABS = TABS.filter(t => t.id !== id).concat({ id, name, from: ADD.from, to: ADD.to, pending: true });
  drawTabs();
});

load().catch(e => { $("status").textContent = "Ошибка загрузки данных: " + e.message; $("status").classList.add("err"); });
</script>
